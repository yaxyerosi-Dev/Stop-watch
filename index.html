<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white flex items-center justify-center">

  <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl text-center w-80">
    <h1 class="text-4xl font-bold text-yellow-400 mb-6">Stopwatch</h1>

    <div
      id="display"
      class="text-5xl font-bold mb-8 tracking-wider"
    >
      00:00:00
    </div>

    <div class="flex justify-center gap-3">
      <button
        id="startBtn"
        class="bg-green-500 px-5 py-2 rounded-lg font-bold hover:bg-green-600"
      >
        Start
      </button>

      <button
        id="stopBtn"
        class="bg-red-500 px-5 py-2 rounded-lg font-bold hover:bg-red-600"
      >
        Stop
      </button>

      <button
        id="resetBtn"
        class="bg-yellow-400 text-gray-900 px-5 py-2 rounded-lg font-bold hover:bg-yellow-500"
      >
        Reset
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
